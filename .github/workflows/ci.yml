name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify, check store texts and build the debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify (tests, lint, debug and release builds, permissions, dependencies)
        run: bash tools/verify.sh

      - name: Check store text limits (en-US and pt-PT)
        run: |
          set -euo pipefail
          status=0
          for locale in en-US pt-PT; do
            dir="fastlane/metadata/android/$locale"
            check() { # file, max characters
              local file=$1 max=$2 count
              count=$(python3 -c 'import sys; print(len(open(sys.argv[1], encoding="utf-8").read().strip()))' "$file")
              if (( count > max )); then
                echo "$file: $count characters, limit is $max" >&2
                status=1
              else
                echo "$file: $count / $max"
              fi
            }
            check "$dir/title.txt" 50
            check "$dir/short_description.txt" 80
            check "$dir/full_description.txt" 4000
            for changelog in "$dir"/changelogs/*.txt; do
              check "$changelog" 500
            done
          done
          exit "$status"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nightfleet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload logs and reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-and-reports
          path: |
            logs/
            **/build/reports/
            **/build/test-results/

  reproducible:
    name: Reproducible unsigned release (two clean clones)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the unsigned release twice and compare
        run: bash tools/repro_check.sh

      - name: Upload the reproducibility log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-check-log
          path: logs/repro_check.log
          if-no-files-found: warn
